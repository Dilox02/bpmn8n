# Every push and pull request: lint and Django tests, the n8n nodes and editor hooks, and the web image.
# No browsers and no live stack: the e2e tests need n8n and the models server (pytest e2e, by hand).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py test bpmn8n  # SQLite, no environment variables

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: n8n-nodes-bpmn8n/package-lock.json
      - run: npm ci
        working-directory: n8n-nodes-bpmn8n
      - run: npm test
        working-directory: n8n-nodes-bpmn8n
      - run: node --test n8n-editor/test/*.test.mjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bpmn8n-web:ci .  # built, never pushed
