# bpmn8n stack: Django (tasks API, inbox, Studio, docs) + n8n with the BPMN nodes + Laya and GLiNER models.
services:
  web: &web
    image: python:3.12-slim
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "pip install -q --root-user-action=ignore -r requirements.txt && { [ ! -f requirements.local.txt ] || pip install -q --root-user-action=ignore -r requirements.local.txt; } && python manage.py migrate --noinput && gunicorn bpmn8n.wsgi -b 0.0.0.0:8000 --workers $${WEB_WORKERS:-4} --threads 16 --backlog 2048 --keep-alive 0 --graceful-timeout 900 --reload --pid /tmp/gunicorn.pid --access-logfile -"
    # several processes: tasks, event log and metrics live in Postgres (runserver dropped
    # connections when n8n ran 30 cases at once); no keep-alive: clients reusing a connection
    # the server was closing got "socket hang up"; the pid file lets Studio reload it with new tasks, and
    # the graceful timeout covers bounded local generation + critic calls, including JSON repair (up to 720 s);
    # requirements.local.txt (git-ignored) holds the packages of local projects that are not in the repository
    ports: ["127.0.0.1:8000:8000"]
    environment: &web-env
      DEBUG: "1"  # development: docker-compose.prod.yml runs the built image with DEBUG=0
      # ./start.sh sets them: the models server on the Mac (host.docker.internal:8001) or containers
      LAYA_URL: ${LAYA_URL:-http://laya:8000/v1/systemone}
      EXTRACTOR_URL: ${EXTRACTOR_URL:-http://models:8001/v1/extract}
      OCR_URL: ${OCR_URL:-http://models:8001/v1/ocr}  # only the native models server on a Mac reads images
      N8N_URL: http://n8n:5678  # user tasks resume executions here
      PYTHONPYCACHEPREFIX: /tmp/pycache  # the container's bytecode apart from the host's: both write the mounted tree
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}  # links to the editor
      N8N_API_KEY: ${N8N_API_KEY:-}  # ./start.sh creates it: conformance reads workflows, Studio creates them
      N8N_PREVIEW_URL: ${N8N_PREVIEW_URL:-http://localhost:5679}  # Studio embeds the workflow's canvas from it
      N8N_CREDENTIAL: ${N8N_CREDENTIAL:-}  # ./start.sh: the credential Studio's workflows use
      SEARCH_URL: ${SEARCH_URL:-http://searxng:8080}  # Studio's domain research; empty: none
      BPMN8N_API_TOKEN: ${BPMN8N_API_TOKEN:-}
      WEB_WORKERS: ${WEB_WORKERS:-4}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpmn8n-dev}
      # global variables and the event stream; database 1, n8n's queue uses 0
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      EVENT_WEBHOOKS: ${EVENT_WEBHOOKS:-}  # comma-separated URLs that receive every finished step
      # people's notifications (docs/GUIDE.md, "People"); the console backend only prints them
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-bpmn8n@localhost}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # The jobs on a clock (docs/GUIDE.md, "Production"): run_deadlines every minute, `prune` daily. PRUNE_DAYS:
  # archive events and delete task runs older than that many days; empty: nothing is pruned. A second scheduler
  # (`python -m bpmn8n schedule` included) waits on a database lock
  scheduler:
    <<: *web
    ports: []
    command: sh -c "pip install -q --root-user-action=ignore -r requirements.txt && until python manage.py migrate --check >/dev/null 2>&1; do sleep 3; done && exec python manage.py run_scheduler"
    restart: unless-stopped
    environment:
      <<: *web-env
      PYTHONUNBUFFERED: "1"  # its log lines show as they happen (the dev image does not set it)
      PRUNE_DAYS: ${PRUNE_DAYS:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_started}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bpmn8n
      POSTGRES_USER: bpmn8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpmn8n-dev}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bpmn8n"]
      interval: 2s
      timeout: 3s
      retries: 30

  # n8n in queue mode: `n8n` receives webhooks and serves the editor, `n8n-worker` runs the
  # executions (scale with `docker compose up -d --scale n8n-worker=N`); Redis is the queue.
  # Pinned: the editor hooks (n8n-editor/: bpmn.js matches n8n's class names, panel.js reads its stores) are
  # verified against this version. Bump it here and on n8n-preview (n8n-worker inherits it) together, only after
  # the hooks' checks pass on the new version (docs/GUIDE.md, "Production").
  n8n: &n8n
    image: docker.n8n.io/n8nio/n8n:2.42.3
    ports: ["127.0.0.1:5678:5678"]
    environment: &n8n-env
      N8N_CUSTOM_EXTENSIONS: /bpmn8n-nodes  # ./start.sh builds n8n-nodes-bpmn8n into it
      BPMN8N_PUBLIC_URL: ${BPMN8N_PUBLIC_URL:-http://localhost:8000}  # the human task nodes link to its pages
      N8N_PERSONALIZATION_ENABLED: "false"
      # pages allowed to show n8n's canvas in an iframe (e.g. a dashboard on :8080: set your page's
      # origin); n8n otherwise sends X-Frame-Options: SAMEORIGIN, which CSP frame-ancestors supersedes
      N8N_CONTENT_SECURITY_POLICY: '{"frame-ancestors": ["''self''", "http://localhost:8000", "http://127.0.0.1:8000", "http://localhost:8080", "http://127.0.0.1:8080"]}'
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: bpmn8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-bpmn8n-dev}
      EXECUTIONS_MODE: queue
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"  # shows the completed nodes while the run is still going
      QUEUE_BULL_REDIS_HOST: redis
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_RUNNERS_ENABLED: "true"
      # one origin (PUBLIC_URL, the gateway below): the editor under /n8n/, webhooks and resume URLs at the
      # gateway's root; empty: n8n's defaults, the editor at the root of :5678
      N8N_PATH: ${N8N_PATH:-/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      # BPMN shapes on the canvas, and bpmn8n's card on top of a node's panel (it reads bpmn8n's OpenAPI at
      # ?bpmn8n=); under N8N_PATH; n8n caches /static for a day: bump v on edits
      EXTERNAL_FRONTEND_HOOKS_URLS: ${N8N_PATH:-/}static/bpmn8n-bpmn.js?v=7;${N8N_PATH:-/}static/bpmn8n-panel.js?v=5&bpmn8n=${BPMN8N_PUBLIC_URL:-http://localhost:8000};${N8N_PATH:-/}static/bpmn8n-evaluations.js?v=10&bpmn8n=${BPMN8N_PUBLIC_URL:-http://localhost:8000};${N8N_PATH:-/}static/bpmn8n-executions.js?v=7&bpmn8n=${BPMN8N_PUBLIC_URL:-http://localhost:8000}&preview=${N8N_PREVIEW_URL:-http://localhost:5679};${N8N_PATH:-/}static/bpmn8n-insights.js?v=3&bpmn8n=${BPMN8N_PUBLIC_URL:-http://localhost:8000};${N8N_PATH:-/}static/bpmn8n-strip.js?v=1&bpmn8n=${BPMN8N_PUBLIC_URL:-http://localhost:8000}
      N8N_DIAGNOSTICS_ENABLED: "false"  # no telemetry, and none of its surveys in the editor
    volumes:  # the shared n8n_data volume also shares the credentials' encryption key
      - n8n_data:/home/node/.n8n
      - ./n8n-nodes-bpmn8n/dist:/bpmn8n-nodes:ro
      - ./n8n-editor/bpmn.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-bpmn.js:ro
      - ./bpmn8n/static/bpmn8n/tokens.css:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-tokens.css:ro  # bpmn8n's tokens, linked by bpmn.js
      - ./n8n-editor/panel.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-panel.js:ro
      - ./n8n-editor/evaluations.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-evaluations.js:ro
      - ./n8n-editor/evaluations.css:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-evaluations.css:ro
      - ./n8n-editor/live.mjs:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-live.mjs:ro
      - ./n8n-editor/executions.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-executions.js:ro
      - ./n8n-editor/executions.css:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-executions.css:ro
      - ./n8n-editor/insights.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-insights.js:ro
      - ./n8n-editor/strip.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-strip.js:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  n8n-worker:
    <<: *n8n
    command: worker --concurrency=20
    ports: []

  # A read-only canvas to embed in other pages (Studio shows each project's workflow with it), with n8n's
  # own preview architecture (its n8n-demo component): an instance in preview mode opens /workflows/demo
  # without login and draws the workflow received by postMessage; it stores and runs nothing.
  n8n-preview:
    image: docker.n8n.io/n8nio/n8n:2.42.3  # the same version as n8n
    ports: ["127.0.0.1:5679:5678"]
    environment:
      N8N_PREVIEW_MODE: "true"
      N8N_CUSTOM_EXTENSIONS: /bpmn8n-nodes
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_CONTENT_SECURITY_POLICY: '{"frame-ancestors": ["''self''", "http://localhost:5678", "http://127.0.0.1:5678", "http://localhost:8000", "http://127.0.0.1:8000", "http://localhost:8080", "http://127.0.0.1:8080"]}'
      # over plain HTTP on a host other than localhost (preview.localhost behind the gateway) n8n's editor shows
      # only a warning when its cookie is Secure; the preview signs nobody in
      N8N_SECURE_COOKIE: ${N8N_PREVIEW_SECURE_COOKIE:-true}
      EXTERNAL_FRONTEND_HOOKS_URLS: /static/bpmn8n-bpmn.js?v=6;/static/bpmn8n-theme.js?v=11  # bump v on edits
    volumes:
      - ./n8n-nodes-bpmn8n/dist:/bpmn8n-nodes:ro
      - ./n8n-editor/bpmn.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-bpmn.js:ro
      - ./bpmn8n/static/bpmn8n/tokens.css:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-tokens.css:ro  # bpmn8n's tokens, linked by bpmn.js
      - ./n8n-editor/preview.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist/static/bpmn8n-theme.js:ro

  # One origin (docs/GUIDE.md, "One origin (optional)"), off by default: Caddy serves Django at /, the editor at
  # /n8n/, the webhooks at the root and the preview on its own host (deploy/Caddyfile). PUBLIC_URL turns it on:
  # `python -m bpmn8n up` passes the profile and n8n's variables (bpmn8n/config.py, compose_env)
  gateway:
    profiles: ["one-origin"]
    image: caddy:2.11-alpine
    ports: ["127.0.0.1:${GATEWAY_PORT:-8090}:80"]
    environment:
      PREVIEW_ADDRESS: ${PREVIEW_ADDRESS:-http://preview.localhost}
      BPMN8N_PUBLIC_URL: ${BPMN8N_PUBLIC_URL:-http://localhost:8090}  # the pages that may frame the preview
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [web, n8n, n8n-preview]

  # web search for Studio's domain research: SearXNG asks several search engines and answers in JSON, with
  # no API key; only the web container reaches it (no port on the host)
  searxng:
    image: docker.io/searxng/searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-bpmn8n-dev-searxng}
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes  # global variables survive a restart
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  models:
    # GLiNER2.5 extraction on CPU, for hosts without the native models server
    profiles: ["cpu-models"]
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -q --root-user-action=ignore --extra-index-url https://download.pytorch.org/whl/cpu 'gliner2[local]' protobuf sentencepiece tiktoken && python tools/models_server.py --host 0.0.0.0 --port 8001 --no-laya"
    volumes: ["./tools:/app/tools:ro", "models_cache:/root/.cache"]

  laya:
    # Laya on CPU in Docker, for hosts without the native models server
    profiles: ["cpu-models"]
    # ponytail: pip install at boot (first start downloads torch + weights); use Laya's own Dockerfile for prod
    image: python:3.12-slim
    command: sh -c "pip install -q --root-user-action=ignore --extra-index-url https://download.pytorch.org/whl/cpu 'laya[serve]>=0.3.28' && laya-serve"
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"  # /health answers only once the checkpoints are loaded
      LAYA_MODELS: english,multilingual  # what the router picks between; typed-decisions loads on demand
    volumes: ["laya_cache:/root/.cache"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      start_period: 20m

volumes:
  pg_data:
  redis_data:
  n8n_data:
  laya_cache:
  models_cache:
